<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock Draft 2027</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">2027 NFL DRAFT</p>

        <div class="info">

        </div>
      </li>
      <li class="player">
        <span class="rank">2</span>
        <div class="info">
          <span class="name">Leonard Moore</span>
          <span class="meta">CB · Notre Dame</span>
        </div>
      </li>
      <li class="player">
        <span class="rank">3</span>
        <div class="info">
          <span class="name">Colin Simmons</span>
          <span class="meta">EDGE · Texas</span>
        </div>
      </li>
    </ol>

    <button class="start">Start draft</button>

</body>
</html>
