<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock Draft 2027</title>

  <!-- Makes it installable: home screen icon, opens full-screen like an app -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#10151C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mock Draft">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- Screen 1: pick your team -->
    <section id="setup-screen">
      <p class="eyebrow">2027 NFL DRAFT</p>
      <h1>Mock Draft</h1>
      <p class="subtitle" id="subtitle">Loading…</p>

      <div class="label-row">
        <h2 class="section-label">CHOOSE YOUR TEAM</h2>
        <span class="section-note">Round 1 picks</span>
      </div>
      <div class="team-grid" id="team-grid"></div>

      <h2 class="section-label">ROUNDS</h2>
      <div class="rounds" id="rounds"></div>

      <button class="start" id="start-button" disabled>Pick a team to start</button>
    </section>

    <!-- Screen 2: the draft -->
    <section id="draft-screen" hidden>
      <div class="draft-header">
        <div class="draft-heading">
          <p class="eyebrow" id="draft-eyebrow">ROUND 1</p>
          <h1 id="draft-title">Draft room</h1>
        </div>
        <div class="my-gm" id="my-gm"></div>
      </div>

      <div class="status" id="status">Starting…</div>
      <div class="hints" id="hints" hidden></div>

      <h2 class="section-label">PICKS</h2>
      <div class="ticker" id="feed"></div>

      <h2 class="section-label" id="board-label">BIG BOARD</h2>
      <div class="filters" id="filters"></div>
      <ol class="board" id="board"></ol>

      <div class="action-bar" id="action-bar" hidden>
        <button class="secondary" id="pause-button">Pause</button>
        <button class="secondary" id="trade-button">Trade</button>
      </div>
    </section>

    <!-- Trade panel: slides up over the draft screen -->
    <div class="sheet-backdrop" id="trade-sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="trade-title">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 class="sheet-title" id="trade-title">Trade</h2>
          <button class="close-button" id="close-trade" aria-label="Close">✕</button>
        </div>
        <div class="tabs">
          <button class="tab" id="tab-down">Trade down</button>
          <button class="tab" id="tab-up">Trade up</button>
        </div>
        <div class="sheet-worth" id="trade-worth"></div>
        <div id="trade-offers"></div>
      </div>
    </div>

    <!-- Screen 3: grades -->
    <section id="results-screen" hidden>
      <p class="eyebrow" id="results-eyebrow">DRAFT COMPLETE</p>

      <div class="grade-card">
        <div class="grade-gm" id="grade-gm"></div>
        <div class="grade-side">
          <div class="grade-top">
            <div class="grade-letter" id="my-grade">–</div>
            <div class="grade-info">
              <div class="grade-team" id="my-team-name"></div>
              <div class="meta" id="my-grade-detail"></div>
            </div>
          </div>
          <p class="gm-quote" id="grade-quote" hidden></p>
        </div>
      </div>

      <h2 class="section-label">YOUR CLASS</h2>
      <ol class="board" id="my-class"></ol>

      <h2 class="section-label">ALL TEAMS</h2>
      <ol class="grades" id="all-grades"></ol>

      <div class="results-buttons">
        <button class="secondary" id="view-picks-button">View all picks</button>
        <button class="start" id="new-mock-button">New mock</button>
      </div>
    </section>


  </main>
  <script src="gm.js"></script>
  <script src="app.js"></script>
</body>
</html>
